name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: 20

      - name: Build extension artifacts
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        run: |
          npm ci --prefix browser-extension
          npm --prefix browser-extension run package

      - name: Upload extension artifacts to release
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXT_VERSION: ${{ steps.release.outputs['browser-extension--version'] }}
          EXT_TAG: ${{ steps.release.outputs['browser-extension--tag_name'] }}
        run: |
          gh release upload "$EXT_TAG" \
            "browser-extension/artifacts/reeldock-chrome-v$EXT_VERSION.zip" \
            "browser-extension/artifacts/reeldock-firefox-v$EXT_VERSION.zip" \
            --clobber
