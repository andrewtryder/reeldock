name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Bot-opened release PRs sit in action_required until a human approves
      # workflows, so uv-lock-sync.yml often never runs. Sync uv.lock here on
      # the trusted push-to-main job instead.
      - name: Checkout release-please branch
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: release-please--branches--main
          fetch-depth: 0

      - name: Install uv
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          python-version: "3.14"

      - name: Sync uv.lock on release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          uv lock
          if git diff --quiet uv.lock; then
            echo "uv.lock is already in sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(deps): sync uv.lock with pyproject.toml"
          git push

      - name: Checkout repository
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: 20

      - name: Build extension artifacts
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        run: |
          npm ci --prefix browser-extension
          npm --prefix browser-extension run package

      - name: Upload extension artifacts to release
        if: ${{ steps.release.outputs['browser-extension--release_created'] == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXT_VERSION: ${{ steps.release.outputs['browser-extension--version'] }}
          EXT_TAG: ${{ steps.release.outputs['browser-extension--tag_name'] }}
        run: |
          gh release upload "$EXT_TAG" \
            "browser-extension/artifacts/reeldock-chrome-v$EXT_VERSION.zip" \
            "browser-extension/artifacts/reeldock-firefox-v$EXT_VERSION.zip" \
            --clobber
