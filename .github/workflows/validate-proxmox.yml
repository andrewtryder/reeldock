name: Validate Proxmox Installer

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/proxmox/**'
      - '.github/workflows/validate-proxmox.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/proxmox/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 1. Lint Shell Scripts
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        with:
          scandir: 'scripts/proxmox'

      # 2. Validate Cloud-Init Schema
      - name: Install cloud-init validator
        run: |
          sudo apt-get update
          sudo apt-get install -y cloud-init

      - name: Validate Cloud-Init Schema
        run: |
          cloud-init schema -c scripts/proxmox/cloud-init-user-data.yml
