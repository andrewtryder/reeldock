repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: python-coverage
        name: python coverage 80
        entry: bash -c 'uv run --frozen coverage run -m pytest -q --tb=line && uv run --frozen coverage report'
        language: system
        types: [python]
        pass_filenames: false
      - id: extension-coverage
        name: extension coverage 80
        entry: npm --prefix browser-extension run test:coverage
        language: system
        files: ^browser-extension/.*\.(js|mjs)$
        pass_filenames: false
