<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ReelDock</title>
  <style>
    :root {
      color-scheme: light dark;
      --primary: #6c8ef7;
      --primary-container: #dbe1ff;
      --on-primary-container: #00297a;
      --background: #121319;
      --surface: #1e1f26;
      --surface-variant: #33343b;
      --outline-variant: #444653;
      --error: #f87171;
      --error-container: #93000a;
      --on-error: #690005;
      --success: #4caf50;
      --success-container: #c8e6c9;
      --on-success-container: #1b5e20;
    }

    body {
      font-family: system-ui, sans-serif;
      width: 360px;
      margin: 0;
      padding: 12px;
      background: var(--background);
      color: #e2e1eb;
    }

    h1 {
      font-size: 1.1rem;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }

    .banner {
      display: none;
      margin: 8px 0;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.8rem;
      background: #3e2f12;
      border: 1px solid #ffb74d;
      color: #ffe0b2;
    }

    .banner.visible { display: block; }

    #video {
      margin: 8px 0;
      font-size: 0.9rem;
      min-height: 2.2em;
      padding: 8px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--outline-variant);
    }

    .field { margin: 8px 0; }
    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #c4c6d5;
      margin-bottom: 4px;
    }

    select, button, input[type="checkbox"] { font: inherit; }

    select {
      width: 100%;
      padding: 6px 8px;
      background: var(--surface);
      color: #e2e1eb;
      border: 1px solid var(--outline-variant);
      border-radius: 6px;
    }

    .pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      flex: 1;
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid var(--outline-variant);
      background: var(--surface);
      color: #c4c6d5;
      cursor: pointer;
      width: auto;
    }
    .pill.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-color: var(--primary);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 0.85rem;
      color: #c4c6d5;
    }

    .row.secondary { opacity: 0.85; font-size: 0.8rem; }

    button.primary {
      width: 100%;
      padding: 10px;
      cursor: pointer;
      background: var(--primary);
      color: var(--on-primary-container);
      border: none;
      border-radius: 8px;
      font-weight: 600;
    }
    button.primary:disabled {
      background: var(--surface-variant);
      color: var(--outline-variant);
      cursor: not-allowed;
    }

    button.ghost {
      width: auto;
      padding: 4px 8px;
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--outline-variant);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    #status {
      margin-top: 8px;
      font-size: 0.85rem;
      min-height: 1.2em;
      padding: 8px;
      border-radius: 6px;
    }
    #status.err { background: var(--error-container); color: var(--on-error); }
    #status.ok { background: var(--success-container); color: var(--on-success-container); }
    #status.pending { background: var(--surface-variant); color: #c4c6d5; }

    #recent { margin-top: 12px; }
    #recent h2 {
      font-size: 0.8rem;
      margin: 0 0 6px;
      color: #c4c6d5;
    }
    .job {
      padding: 8px;
      margin-bottom: 6px;
      background: var(--surface);
      border: 1px solid var(--outline-variant);
      border-radius: 8px;
    }
    .job-title { font-size: 0.85rem; font-weight: 600; }
    .job-meta { font-size: 0.75rem; color: #c4c6d5; margin: 2px 0 6px; }
    .job-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: var(--surface-variant);
      border-radius: 2px;
      margin: 4px 0;
      overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--primary); }
    .progress-bar.indeterminate .progress-fill {
      width: 40%;
      animation: progress-indeterminate 1.2s ease-in-out infinite;
    }
    @keyframes progress-indeterminate {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(280%); }
    }

    footer {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--outline-variant);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer button { margin: 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <h1>
    <img class="app-icon" src="icons/icon.svg" alt="ReelDock icon" />
    ReelDock
  </h1>

  <div id="legacy-banner" class="banner"></div>
  <div id="dest-banner" class="banner"></div>

  <div id="video">Checking current tab…</div>

  <form id="queue-form">
    <div id="destination-field" class="field hidden">
      <label for="destination">Save to</label>
      <select id="destination"></select>
    </div>

    <div id="quality-field" class="field hidden">
      <label>Quality</label>
      <div class="pills" role="group" aria-label="Audio quality">
        <button type="button" class="pill active" data-quality="standard">Standard</button>
        <button type="button" class="pill" data-quality="high">High</button>
        <button type="button" class="pill" data-quality="best">Best</button>
      </div>
    </div>

    <label class="row" for="embed-metadata">
      <input id="embed-metadata" type="checkbox" checked />
      Embed metadata
    </label>
    <label class="row" for="embed-thumbnail">
      <input id="embed-thumbnail" type="checkbox" checked />
      Embed thumbnail
    </label>
    <label class="row" for="embed-chapters">
      <input id="embed-chapters" type="checkbox" checked />
      Embed chapters
    </label>
    <label class="row hidden" id="sponsorblock-row" for="sponsorblock">
      <input id="sponsorblock" type="checkbox" />
      Skip sponsor segments
    </label>
    <label class="row secondary" for="allow-reimport">
      <input id="allow-reimport" type="checkbox" />
      Allow importing this video again
    </label>

    <button type="submit" class="primary" id="queue" disabled>Create Audiobook</button>
  </form>

  <div id="status" class="pending">Ready</div>

  <section id="recent">
    <h2>Recent</h2>
    <div id="recent-list"></div>
  </section>

  <footer>
    <button type="button" class="ghost" id="open-reeldock">Open ReelDock</button>
    <span>v<span id="extension-version">...</span></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
