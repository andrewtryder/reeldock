# ============================================================
# docker-compose.yml — reeldock
# ============================================================
#
# Three services:
#   app     — FastAPI web server
#   worker  — RQ background worker
#   redis   — Task queue
#
# Runtime configuration comes from `.env` (env_file) plus explicit
# environment entries below. Compose interpolates `.env` for ${VAR}
# substitution AND injects those values into the containers via env_file.
# Stack wiring (REDIS_URL, DATABASE_URL, paths) is set explicitly so it
# wins over accidental host/Redis overrides in `.env`.
#
# Volume layout is driven by these environment variables:
#   HOST_AUDIOBOOKS_DIR     → Path on the Docker host (e.g. /mnt/podcasts or /Volumes/.../Podcasts)
#   OUTPUT_ROOT             → Path inside the containers (default: /media/podcasts); also used as the bind-mount target
#
# Legacy aliases (still accepted):
#   HOST_PODCASTS_DIR       → same as HOST_AUDIOBOOKS_DIR
#   CONTAINER_PODCASTS_DIR  → same as OUTPUT_ROOT (container mount target)
#
# Other mounted volumes:
#   ./data    → /data       (SQLite database, work/download files, logs)
#   ./config  → /config     (Optional YAML + instance settings key)
#
# Blank AUTH_PASSWORD / EXTENSION_API_TOKEN / ABS_* values are treated as unset
# so the Web UI can configure auth, pairing, and Audiobookshelf. Pairing is the
# recommended browser onboarding path; EXTENSION_API_TOKEN is legacy.
#
# ── NFS note ──────────────────────────────────────────────────────────────────
# Recommended: Mount your network/NFS share on the Docker HOST machine first,
# then bind-mount it here via HOST_AUDIOBOOKS_DIR. This avoids Docker NFS driver quirks.
#
#   /etc/fstab example (Proxmox/Linux host):
#     nas.local:/volume1/podcasts  /mnt/podcasts  nfs  defaults,_netdev,nofail  0  0
# ──────────────────────────────────────────────────────────────────────────────

x-app-environment: &app-environment
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: sqlite+aiosqlite:////data/app.db
  OUTPUT_ROOT: ${OUTPUT_ROOT:-${CONTAINER_PODCASTS_DIR:-/media/podcasts}}
  WORK_DIR: /data/work
  # Legacy path only; unused for duplicate detection (ImportedVideo ledger).
  ARCHIVE_FILE: /data/config/youtube-archive.txt
  REELDOCK_CONFIG_MODE: ${REELDOCK_CONFIG_MODE:-ui}
  AUTH_ENABLED: ${AUTH_ENABLED:-false}
  AUTH_USERNAME: ${AUTH_USERNAME:-}
  AUTH_PASSWORD: ${AUTH_PASSWORD:-}
  EXTENSION_API_ENABLED: ${EXTENSION_API_ENABLED:-false}
  EXTENSION_API_TOKEN: ${EXTENSION_API_TOKEN:-}
  EXTENSION_PUBLIC_URL: ${EXTENSION_PUBLIC_URL:-}
  ABS_BASE_URL: ${ABS_BASE_URL:-}
  ABS_API_TOKEN: ${ABS_API_TOKEN:-}
  ABS_LIBRARY_ID: ${ABS_LIBRARY_ID:-}
  ABS_SCAN_AFTER_SUCCESS: ${ABS_SCAN_AFTER_SUCCESS:-false}
  PUID: ${PUID:-}
  PGID: ${PGID:-}

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: reeldock:latest
    container_name: reeldock-app
    command: app
    restart: unless-stopped
    env_file:
      - .env
    # By default, bind only to localhost for safety.
    # To expose the service to your LAN, change to "8080:8080", enable AUTH_* in
    # `.env`, then recreate: docker compose up -d --force-recreate
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - type: bind
        source: ${HOST_AUDIOBOOKS_DIR:-${HOST_PODCASTS_DIR:-/mnt/podcasts}}
        target: ${OUTPUT_ROOT:-${CONTAINER_PODCASTS_DIR:-/media/podcasts}}
        bind:
          create_host_path: false
      - ./config:/config
    environment:
      <<: *app-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8080/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: reeldock:latest
    container_name: reeldock-worker
    command: worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
      - type: bind
        source: ${HOST_AUDIOBOOKS_DIR:-${HOST_PODCASTS_DIR:-/mnt/podcasts}}
        target: ${OUTPUT_ROOT:-${CONTAINER_PODCASTS_DIR:-/media/podcasts}}
        bind:
          create_host_path: false
      - ./config:/config
    environment:
      <<: *app-environment
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  redis:
    image: redis:8.10-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    container_name: reeldock-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
